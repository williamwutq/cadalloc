[package]
name = "cadalloc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["William Wu <williamwutq@gmail.com>", "Claude <claude@anthropic.com>"]
license = "MIT"
description = "A minimal, configurable, embeddable allocator with segregated free lists for multithreaded environments"
readme = "README.md"
repository = "https://github.com/williamwutq/cadalloc"
documentation = "https://docs.rs/cadalloc"
keywords = ["allocator", "memory", "segregated-free-list", "no_std", "embedded"]
categories = ["memory-management", "no-std", "concurrency"]
publish = false

# `changelog` is not a Cargo manifest key; setting it at package level emits
# "unused manifest key" on every invocation. `[package.metadata]` is the
# sanctioned home for custom data and is ignored silently.
[package.metadata]
changelog = "CHANGELOG.md"

[package.metadata.docs.rs]
all-features = true

[features]
# Implement `core::alloc::GlobalAlloc` for `CadAlloc<C>` (see the `global`
# module). Off by default; enable to use cadalloc as a `#[global_allocator]`.
alloc = []

[dependencies]

# Loom is pulled in only for model-checking the lock-free bins, and only when
# the crate is built with `--cfg loom` (see the `loom_stack` test module). A
# normal `cargo test` never compiles or downloads it.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `--cfg loom` is a deliberate custom cfg (the loom model-check build).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# Uncomment for a stricter crate. Expect to silence some of these individually.
# pedantic = { level = "warn", priority = -1 }
