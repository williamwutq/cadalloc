name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Non-blocking cells:
    #   - beta is a canary for the next stable, run for early warning only.
    #   - windows currently crashes the compiler backend during test codegen
    #     (STATUS_ILLEGAL_INSTRUCTION, no ICE message) on stable and beta alike;
    #     it is not a diagnostic our code earned. Keep running it so it goes
    #     green once the toolchain is fixed, but don't let it block CI for now.
    # Stable/nightly on Linux and macOS stay required.
    continue-on-error: ${{ matrix.os == 'windows-latest' || matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
        exclude:
          # Trim the matrix: nightly on Windows is the least informative cell.
          - os: windows-latest
            rust: nightly
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Cache
      uses: Swatinem/rust-cache@v2
    - name: Check
      run: cargo check --all-targets
    - name: Test
      run: cargo test
    - name: Test Release
      run: cargo test --release
    - name: Test with all features
      run: cargo test --all-features
